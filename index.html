<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مهامي الدراسية</title>
<style>
body{font-family:Arial;background:#eef2f7;padding:20px;text-align:center}
main{max-width:450px;margin:auto;background:white;padding:20px;border-radius:15px}
input{padding:12px;width:60%}
button{padding:12px;background:#1769aa;color:white;border:0;border-radius:7px;margin:4px}
li{margin:12px;text-align:right}
</style>
</head>
<body>
<main>
<h2>📚 مهامي الدراسية</h2>
<p>اكتب واجبك وأضفه إلى قائمتك</p>
<input id="task" placeholder="اكتب المهمة هنا">
<button onclick="addTask()">إضافة</button>
<ul id="tasks"></ul>
</main>
<script>
function addTask(){
let input=document.getElementById('task');
if(!input.value.trim())return;
let li=document.createElement('li');
li.append(document.createTextNode(input.value+' '));
let done=document.createElement('button');
done.textContent='تمت';
done.onclick=()=>li.style.textDecoration='line-through';
let del=document.createElement('button');
del.textContent='حذف';
del.onclick=()=>li.remove();
li.append(done,del);
document.getElementById('tasks').append(li);
input.value='';
}
</script>
</body>
</html>
